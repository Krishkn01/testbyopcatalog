# Rendered Kustomization Overlay for test-minimal-001
# This file is generated from template/kustomization.yaml.tmpl
# Instance: test-minimal-001
# Namespace: fhir-minimal

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fhir-minimal

# Base manifests from GitHub repository
resources:
- https://github.com/Krishkn01/testbyopcatalog//services/sccat-fhir-healthcare/v1/manifests?ref=main

# Name prefix for all resources
namePrefix: test-minimal-001-

# Common labels
commonLabels:
  app.kubernetes.io/instance: test-minimal-001
  app.kubernetes.io/managed-by: sovereign-core
  environment: dev

# Patches for instance-specific configuration
patches:
# PostgreSQL StatefulSet patches
- target:
    kind: StatefulSet
    name: postgres
  patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
      value: 5Gi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 1Gi
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
      - name: POSTGRES_DB
        valueFrom:
          secretKeyRef:
            name: fhir-minimal-secret
            key: postgres-db
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: fhir-minimal-secret
            key: postgres-user
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: fhir-minimal-secret
            key: postgres-password

# FHIR Deployment patches
- target:
    kind: Deployment
    name: fhir
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 2Gi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "2"
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
      - name: spring.datasource.url
        value: jdbc:postgresql://test-minimal-001-postgres:5432/fhirdb
      - name: spring.datasource.username
        valueFrom:
          secretKeyRef:
            name: fhir-minimal-secret
            key: postgres-user
      - name: spring.datasource.password
        valueFrom:
          secretKeyRef:
            name: fhir-minimal-secret
            key: postgres-password
      - name: spring.datasource.driverClassName
        value: org.postgresql.Driver
      - name: hapi.fhir.fhir_version
        value: R5
      - name: hapi.fhir.validation.enabled
        value: "true"
      - name: hapi.fhir.narrative_enabled
        value: "true"

      - name: hapi.fhir.security.enabled
        value: "true"
      - name: hapi.fhir.security.oauth2.issuer_uri
        value: http://test-minimal-001-keycloak:8180/realms/fhir-healthcare


# Dashboard Deployment patches
- target:
    kind: Deployment
    name: dashboard
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
      - name: REACT_APP_FHIR_SERVER_URL
        value: http://test-minimal-001-fhir:8080/fhir
      - name: REACT_APP_KEYCLOAK_ENABLED
        value: "true"

      - name: REACT_APP_KEYCLOAK_URL
        value: http://test-minimal-001-keycloak:8180
      - name: REACT_APP_KEYCLOAK_REALM
        value: fhir-healthcare
      - name: REACT_APP_KEYCLOAK_CLIENT_ID
        value: fhir-dashboard

      - name: REACT_APP_WEBMETHODS_ENABLED
        value: "true"

# Metering Collector patches
- target:
    kind: Deployment
    name: metering-collector
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
      - name: METERING_DOMAIN
        value: "https://xpm.apps.cluster.local"
      - name: METERING_TOKEN
        valueFrom:
          secretKeyRef:
            name: metering-credentials
            key: metering-token
            optional: true
      - name: PRODUCT_ID
        value: "sccat-fhir-healthcare"
      - name: INSTANCE_ID
        value: "test-minimal-001"
      - name: SUBACCOUNT_ID
        valueFrom:
          secretKeyRef:
            name: metering-credentials
            key: subaccount-id
            optional: true
      - name: FHIR_SERVER_URL
        value: "http://test-minimal-001-fhir:8080"
      - name: POSTGRES_HOST
        value: "test-minimal-001-postgres"
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_DB
        valueFrom:
          secretKeyRef:
            name: fhir-minimal-secret
            key: postgres-db
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: fhir-minimal-secret
            key: postgres-user
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: fhir-minimal-secret
            key: postgres-password
      - name: COLLECTION_INTERVAL
        value: "3600000"
      - name: SUBMISSION_INTERVAL
        value: "3600000"


# Keycloak Deployment patches
- target:
    kind: Deployment
    name: keycloak
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
      - name: KEYCLOAK_ADMIN
        valueFrom:
          secretKeyRef:
            name: keycloak-minimal-secret
            key: admin-user
      - name: KEYCLOAK_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-minimal-secret
            key: admin-password
      - name: KC_DB
        value: postgres
      - name: KC_DB_URL
        value: jdbc:postgresql://test-minimal-001-postgres:5432/keycloakdb
      - name: KC_DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-minimal-secret
            key: db-user
            optional: true
      - name: KC_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-minimal-secret
            key: db-password
            optional: true
      - name: KC_HEALTH_ENABLED
        value: "true"
      - name: KC_METRICS_ENABLED
        value: "true"
      - name: KC_LOG_LEVEL
        value: INFO
      - name: JAVA_OPTS_APPEND
        value: "-Djava.net.preferIPv4Stack=true -Xms512m -Xmx1024m"


# ConfigMap patches
- target:
    kind: ConfigMap
    name: fhir-config
  patch: |-
    - op: replace
      path: /data/fhir.version
      value: R5
    - op: replace
      path: /data/validation.enabled
      value: "true"
    - op: replace
      path: /data/narrative.enabled
      value: "true"
    - op: replace
      path: /data/postgres-host
      value: fhir-postgres

