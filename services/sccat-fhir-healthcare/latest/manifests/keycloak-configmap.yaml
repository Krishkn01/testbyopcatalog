apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  labels:
    app: keycloak
    component: authentication
data:
  realm-fhir.json: |
    {
      "realm": "fhir",
      "enabled": true,
      "displayName": "FHIR Healthcare Realm",
      "displayNameHtml": "<div class=\"kc-logo-text\"><span>FHIR Healthcare</span></div>",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "waitIncrementSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "roles": {
        "realm": [
          {
            "name": "provider",
            "description": "Healthcare Provider - Can create and manage patient records, submit claims"
          },
          {
            "name": "payer",
            "description": "Insurance Payer - Can view claims, process adjudication, manage coverage"
          },
          {
            "name": "admin",
            "description": "System Administrator - Full access to all resources and settings"
          },
          {
            "name": "patient",
            "description": "Patient - Can view own records and coverage information"
          }
        ]
      },
      "clients": [
        {
          "clientId": "fhir-server",
          "name": "FHIR Server",
          "description": "HAPI FHIR Server Backend",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "**********",
          "redirectUris": [
            "*"
          ],
          "webOrigins": [
            "*"
          ],
          "protocol": "openid-connect",
          "publicClient": false,
          "bearerOnly": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "authorizationServicesEnabled": true,
          "fullScopeAllowed": true,
          "attributes": {
            "saml.assertion.signature": "false",
            "saml.force.post.binding": "false",
            "saml.multivalued.roles": "false",
            "saml.encrypt": "false",
            "saml.server.signature": "false",
            "saml.server.signature.keyinfo.ext": "false",
            "exclude.session.state.from.auth.response": "false",
            "saml_force_name_id_format": "false",
            "saml.client.signature": "false",
            "tls.client.certificate.bound.access.tokens": "false",
            "saml.authnstatement": "false",
            "display.on.consent.screen": "false",
            "saml.onetimeuse.condition": "false"
          }
        },
        {
          "clientId": "patient-dashboard",
          "name": "FHIR Patient Dashboard",
          "description": "React-based Patient Dashboard UI",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "redirectUris": [
            "*"
          ],
          "webOrigins": [
            "*"
          ],
          "protocol": "openid-connect",
          "publicClient": true,
          "bearerOnly": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "fullScopeAllowed": true,
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        },
        {
          "clientId": "smart-on-fhir",
          "name": "SMART on FHIR Client",
          "description": "SMART on FHIR OAuth2 Client for EHR Integration",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "*"
          ],
          "webOrigins": [
            "*"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "smart.launch.context": "patient,encounter"
          }
        }
      ],
      "users": [
        {
          "username": "provider1",
          "enabled": true,
          "email": "provider1@healthcare.example.com",
          "firstName": "John",
          "lastName": "Provider",
          "credentials": [
            {
              "type": "password",
              "value": "provider123",
              "temporary": false
            }
          ],
          "realmRoles": ["provider"],
          "attributes": {
            "npi": ["1234567890"],
            "specialty": ["Internal Medicine"]
          }
        },
        {
          "username": "payer1",
          "enabled": true,
          "email": "payer1@insurance.example.com",
          "firstName": "Jane",
          "lastName": "Payer",
          "credentials": [
            {
              "type": "password",
              "value": "payer123",
              "temporary": false
            }
          ],
          "realmRoles": ["payer"],
          "attributes": {
            "organization": ["Blue Cross Blue Shield"],
            "payerId": ["BCBS001"]
          }
        },
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@healthcare.example.com",
          "firstName": "System",
          "lastName": "Administrator",
          "credentials": [
            {
              "type": "password",
              "value": "admin123",
              "temporary": false
            }
          ],
          "realmRoles": ["admin"]
        }
      ],
      "scopeMappings": [
        {
          "clientScope": "offline_access",
          "roles": ["offline_access"]
        }
      ],
      "clientScopeMappings": {
        "account": [
          {
            "client": "fhir-server",
            "roles": ["view-profile", "manage-account"]
          }
        ]
      },
      "defaultDefaultClientScopes": [
        "role_list",
        "profile",
        "email",
        "web-origins"
      ],
      "defaultOptionalClientScopes": [
        "offline_access",
        "address",
        "phone",
        "microprofile-jwt"
      ],
      "browserSecurityHeaders": {
        "contentSecurityPolicyReportOnly": "",
        "xContentTypeOptions": "nosniff",
        "xRobotsTag": "none",
        "xFrameOptions": "SAMEORIGIN",
        "contentSecurityPolicy": "frame-src 'self'; frame-ancestors 'self'; object-src 'none';",
        "xXSSProtection": "1; mode=block",
        "strictTransportSecurity": "max-age=31536000; includeSubDomains"
      },
      "smtpServer": {},
      "eventsEnabled": true,
      "eventsListeners": ["jboss-logging"],
      "enabledEventTypes": [
        "LOGIN",
        "LOGIN_ERROR",
        "LOGOUT",
        "REGISTER",
        "UPDATE_PASSWORD",
        "UPDATE_PROFILE"
      ],
      "adminEventsEnabled": true,
      "adminEventsDetailsEnabled": true,
      "internationalizationEnabled": true,
      "supportedLocales": ["en", "es", "fr", "de"],
      "defaultLocale": "en"
    }

# Made with Bob
