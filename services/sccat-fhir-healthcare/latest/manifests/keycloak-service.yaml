apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
    component: authentication
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8180
    targetPort: 8180
    protocol: TCP
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP
  selector:
    app: keycloak

