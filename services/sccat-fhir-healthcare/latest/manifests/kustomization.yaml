apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for all resources
namespace: fhir-healthcare

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: fhir-healthcare
  app.kubernetes.io/part-of: sovereign-catalogue
  app.kubernetes.io/managed-by: kustomize

# Resources deployed in order
resources:
  # 1. ConfigMaps (must be created first)
  - fhir-configmap.yaml
  - keycloak-configmap.yaml
  - dashboard-configmap.yaml
  
  # 2. PostgreSQL StatefulSet (database must be ready before init job)
  - postgres-statefulset.yaml
  
  # 3. Database Initialization Job (creates keycloak user and database)
  # This MUST run after PostgreSQL is ready and BEFORE Keycloak starts
  - postgres-init-job.yaml
  
  # 4. Sample Data Loader Job (loads test patients and claims after FHIR server is ready)
  - sample-data-loader-job.yaml
  
  # 5. Application Deployments (after database is initialized)
  - fhir-deployment.yaml
  - keycloak-deployment.yaml
  - dashboard-deployment.yaml
  - nodejs-api-deployment.yaml
  - metering-sidecar-deployment.yaml
  
  # 6. Services (can be created anytime)
  - fhir-service.yaml
  - keycloak-service.yaml
  - dashboard-service.yaml
  - nodejs-api-service.yaml
  - postgres-service.yaml
  
  # 7. Ingress (external access)
  - ingress.yaml

# Images to be replaced during deployment
images:
  - name: hapiproject/hapi
    newName: quay.io/ibm-sovereign/sccat-fhir-healthcare/hapi-fhir-jpaserver
    newTag: 7.0.2
  - name: postgres
    newName: quay.io/ibm-sovereign/sccat-fhir-healthcare/postgres
    newTag: 15-alpine
  - name: quay.io/keycloak/keycloak
    newName: quay.io/ibm-sovereign/sccat-fhir-healthcare/keycloak
    newTag: 23.0.0
  - name: patient-dashboard
    newName: quay.io/ibm-sovereign/sccat-fhir-healthcare/patient-dashboard
    newTag: 1.0.0
  - name: nodejs-api-service
    newName: quay.io/ibm-sovereign/sccat-fhir-healthcare/nodejs-api-service
    newTag: 1.0.0

# Configuration patches
patches:
  # Patch to ensure postgres-init-job runs after PostgreSQL is ready
  - target:
      kind: Job
      name: postgres-init
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: postgres-init
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
          argocd.argoproj.io/sync-wave: "1"
      spec:
        template:
          spec:
            initContainers:
            - name: wait-for-postgres
              image: postgres:15-alpine
              command:
              - sh
              - -c
              - |
                echo "Waiting for PostgreSQL to be ready..."
                until pg_isready -h fhir-postgres -p 5432 -U fhiruser; do
                  echo "PostgreSQL is unavailable - sleeping"
                  sleep 2
                done
                echo "PostgreSQL is ready!"
              env:
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: fhir-db-secret
                    key: postgres-password

  # Patch Keycloak to depend on postgres-init-job completion
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak
        annotations:
          argocd.argoproj.io/sync-wave: "2"
      spec:
        template:
          spec:
            initContainers:
            - name: wait-for-db-init
              image: postgres:15-alpine
              command:
              - sh
              - -c
              - |
                echo "Verifying keycloak database exists..."
                until psql -h fhir-postgres -U fhiruser -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='keycloakdb'" | grep -q 1; do
                  echo "Waiting for keycloakdb to be created..."
                  sleep 2
                done
                echo "keycloakdb is ready!"
              env:
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: fhir-db-secret
                    key: postgres-password

  # Patch sample-data-loader to run after FHIR server is ready
  - target:
      kind: Job
      name: sample-data-loader
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: sample-data-loader
        annotations:
          argocd.argoproj.io/hook: PostSync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
          argocd.argoproj.io/sync-wave: "3"

# Deployment order using sync waves (for ArgoCD)
# Wave 0: Secrets, ConfigMaps
# Wave 1: PostgreSQL StatefulSet + postgres-init-job
# Wave 2: Keycloak, FHIR Server, Dashboard, API Service
# Wave 3: Sample Data Loader Job (after FHIR server is ready)
# Wave 4: Services, Ingress

