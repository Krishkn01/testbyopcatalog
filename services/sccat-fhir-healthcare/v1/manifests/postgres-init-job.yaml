apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  labels:
    app: postgres-init
    component: database
spec:
  template:
    metadata:
      labels:
        app: postgres-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: postgres-init
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          echo "=== PostgreSQL Database Initialization ==="
          echo "Waiting for PostgreSQL to be ready..."
          
          until pg_isready -h fhir-postgres -p 5432 -U fhiruser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          
          echo "PostgreSQL is ready. Creating databases and users..."
          
          # Create Keycloak user if not exists
          psql -h fhir-postgres -U fhiruser -d postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='keycloak'" | grep -q 1 || \
          psql -h fhir-postgres -U fhiruser -d postgres -c "CREATE USER keycloak WITH PASSWORD 'keycloak123';"
          
          # Create Keycloak database if not exists
          psql -h fhir-postgres -U fhiruser -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='keycloakdb'" | grep -q 1 || \
          psql -h fhir-postgres -U fhiruser -d postgres -c "CREATE DATABASE keycloakdb OWNER keycloak;"
          
          # Grant privileges
          psql -h fhir-postgres -U fhiruser -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE keycloakdb TO keycloak;"
          
          # Create FHIR database if not exists (should already exist from StatefulSet init)
          psql -h fhir-postgres -U fhiruser -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='fhirdb'" | grep -q 1 || \
          psql -h fhir-postgres -U fhiruser -d postgres -c "CREATE DATABASE fhirdb OWNER fhiruser;"
          
          echo "=== Database initialization complete ==="
          echo "Databases created:"
          psql -h fhir-postgres -U fhiruser -d postgres -c "\l"
          echo ""
          echo "Users created:"
          psql -h fhir-postgres -U fhiruser -d postgres -c "\du"
          
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: fhir-db-secret
              key: postgres-password
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
# This Job should be run after PostgreSQL StatefulSet is ready
# and before Keycloak deployment starts
# 
# Usage:
# kubectl apply -f postgres-init-job.yaml -n <namespace>
# kubectl wait --for=condition=complete job/postgres-init -n <namespace> --timeout=300s
# kubectl apply -f keycloak-deployment.yaml -n <namespace>

